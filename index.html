        let usedIndices = JSON.parse(localStorage.getItem('cambridge_used_indices')) || [];
        let currentBatch = JSON.parse(localStorage.getItem('cambridge_current_batch')) || [];
        let currentQuestionIndex = 0;
        let score = 0;
        let shuffledQuiz = [];

        window.onload = () => {
            // 如果從未生成過內容，或是 currentBatch 為空，則強制生成
            if (currentBatch.length === 0) {
                generateNextBatch();
            } else {
                updateUI();
            }
        };

        function updateUI() {
            const batchNum = Math.ceil(usedIndices.length / 20) || 1;
            document.getElementById('progress-text').innerText = `${usedIndices.length} / ${rawVocabData.length}`;
            document.getElementById('remaining-count').innerText = `剩餘未學: ${rawVocabData.length - usedIndices.length}`;
            document.getElementById('version-display').innerText = `Batch #${batchNum}`;
            document.getElementById('quiz-version-text').innerText = `#${batchNum}`;
            renderTable();
        }

        function generateNextBatch() {
            // 找出還沒學過的
            let availableIndices = [];
            for (let i = 0; i < rawVocabData.length; i++) {
                if (!usedIndices.includes(i)) availableIndices.push(i);
            }

            if (availableIndices.length < 20) {
                alert("恭喜！所有單字皆已學習完畢。進度將重置重新開始。");
                resetAllProgress();
                return;
            }

            // 隨機選 20 個
            availableIndices.sort(() => Math.random() - 0.5);
            let nextBatchIndices = availableIndices.slice(0, 20);
            
            // 更新進度與快照
            currentBatch = nextBatchIndices.map(idx => rawVocabData[idx]);
            usedIndices = [...usedIndices, ...nextBatchIndices];
            
            // 存入儲存空間
            localStorage.setItem('cambridge_used_indices', JSON.stringify(usedIndices));
            localStorage.setItem('cambridge_current_batch', JSON.stringify(currentBatch));
            
            updateUI();
            switchMode('list');
            
            // 如果不是第一次，給個成功的彈窗
            if(usedIndices.length > 20) {
                console.log("New batch generated.");
            }
        }

        function renderTable() {
            const tbody = document.getElementById('vocab-table-body');
            tbody.innerHTML = '';
            
            if (currentBatch.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="p-20 text-center text-slate-400 font-bold italic">目前無資料，請點擊「生成下一版」按鈕。</td></tr>';
                return;
            }

            currentBatch.forEach(item => {
                tbody.innerHTML += `
                    <tr class="border-b border-slate-100 hover:bg-indigo-50/30 transition-colors duration-200">
                        <td class="py-5 px-6">
                            <div class="font-black text-indigo-700 text-lg leading-none">${item[0]}</div>
                            <div class="text-[11px] text-slate-400 font-bold mt-1 bg-slate-100 inline-block px-2 py-0.5 rounded-md">${item[4]}</div>
                        </td>
                        <td class="py-5 px-2 text-center italic text-rose-500 font-black text-xs">${item[1]}</td>
                        <td class="py-5 px-6 leading-relaxed">
                            <p class="font-bold text-slate-700 mb-2">${item[2]}</p>
                            <p class="italic text-slate-400 text-xs border-l-4 border-slate-200 pl-3">"${item[3]}"</p>
                        </td>
                    </tr>`;
            });
        }

        function switchMode(mode) {
            const listMode = document.getElementById('list-mode');
            const quizMode = document.getElementById('quiz-mode');
            const navList = document.getElementById('nav-list');
            const navQuiz = document.getElementById('nav-quiz');

            if (mode === 'list') {
                listMode.classList.remove('hidden');
                quizMode.classList.add('hidden');
                navList.classList.add('btn-active');
                navQuiz.classList.remove('btn-active');
            } else {
                listMode.classList.add('hidden');
                quizMode.classList.remove('hidden');
                navList.classList.remove('btn-active');
                navQuiz.classList.add('btn-active');
                resetQuiz();
            }
        }

        function resetQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            shuffledQuiz = [...currentBatch].sort(() => Math.random() - 0.5);
            document.getElementById('quiz-result').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            const container = document.getElementById('quiz-container');
            const feedback = document.getElementById('quiz-feedback');
            const item = shuffledQuiz[currentQuestionIndex];
            
            document.getElementById('quiz-progress').innerText = `${currentQuestionIndex + 1} / 20`;
            feedback.classList.add('hidden');

            // 產生隨機選項
            let options = [item[0]];
            while(options.length < 4) {
                let randomWord = rawVocabData[Math.floor(Math.random() * rawVocabData.length)][0];
                if(!options.includes(randomWord)) options.push(randomWord);
            }
            options.sort(() => Math.random() - 0.5);

            container.innerHTML = `
                <div class="mb-10 p-6 bg-slate-50 rounded-2xl border-2 border-slate-100">
                    <p class="text-[10px] text-indigo-400 font-black uppercase mb-2 tracking-widest">Question Definition</p>
                    <h3 class="text-2xl font-black text-slate-800 mb-6 leading-tight">${item[2]}</h3>
                    <div class="bg-white p-4 rounded-xl border border-slate-200 italic text-slate-500 shadow-sm">
                        "${item[3].replace(new RegExp(item[0], 'gi'), '__________')}"
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    ${options.map(opt => `
                        <button onclick="checkAnswer('${opt}')" class="quiz-option w-full text-left p-5 border-2 border-slate-100 rounded-2xl hover:border-indigo-500 hover:bg-indigo-50 transition-all duration-200 font-bold text-slate-700 shadow-sm">
                            ${opt}
                        </button>`).join('')}
                </div>`;
        }

        function checkAnswer(selected) {
            const correct = shuffledQuiz[currentQuestionIndex][0];
            const buttons = document.querySelectorAll('.quiz-option');
            const feedback = document.getElementById('quiz-feedback');
            
            feedback.classList.remove('hidden');
            buttons.forEach(btn => btn.disabled = true);

            const isCorrect = (selected === correct);
            if (isCorrect) {
                score++;
                feedback.innerText = "答對了！ ✨ 太棒了";
                feedback.className = "mt-6 p-4 rounded-2xl text-center font-bold text-lg bg-green-100 text-green-700 block shadow-sm border border-green-200";
            } else {
                feedback.innerText = `答錯了。正確單字是 "${correct}"`;
                feedback.className = "mt-6 p-4 rounded-2xl text-center font-bold text-lg bg-red-100 text-red-700 block shadow-sm border border-red-200";
            }

            buttons.forEach(btn => {
                const txt = btn.innerText.trim();
                if(txt === correct) btn.classList.add('correct');
                else if(txt === selected && !isCorrect) btn.classList.add('wrong');
            });

            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < 20) {
                    showQuestion();
                } else {
                    finishQuiz();
                }
            }, 1500);
        }

        function finishQuiz() {
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('quiz-feedback').classList.add('hidden');
            document.getElementById('quiz-result').classList.remove('hidden');
            document.getElementById('score-text').innerText = `本階段得分：${score} / 20`;
        }

        function resetAllProgress() {
            if(confirm("確定要刪除所有學習紀錄嗎？這會讓您回到 Batch #1 重新開始。")) {
                localStorage.clear();
                usedIndices = [];
                currentBatch = [];
                location.reload();
            }
        }
    </script>
</body>
</html>
