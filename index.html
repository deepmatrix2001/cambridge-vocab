<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>劍橋英檢 KET/PET 學習網頁 (20單字隨機版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            #list-mode { display: block !important; }
            body { background: white; padding: 0; }
            table { width: 100%; border-collapse: collapse; }
            th, td { border: 1px solid #000 !important; padding: 8px !important; }
            .container { width: 100% !important; max-width: none !important; padding: 0 !important; }
        }
        .correct { background-color: #d1fae5 !important; border-color: #10b981 !important; color: #065f46; }
        .wrong { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b; }
        .feedback-pop { animation: pop 0.3s ease-out; }
        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <!-- 導覽列 -->
    <nav class="bg-indigo-700 text-white p-4 shadow-lg no-print">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-xl font-bold">Cambridge Vocabulary Mastery: KET & PET</h1>
            <div class="flex space-x-2">
                <button onclick="switchMode('list')" class="px-4 py-2 hover:bg-indigo-800 rounded transition">單字清單</button>
                <button onclick="switchMode('quiz')" class="px-4 py-2 hover:bg-indigo-800 rounded transition">互動測驗</button>
                <button onclick="refreshWords()" class="bg-orange-500 hover:bg-orange-600 px-4 py-2 rounded transition">隨機換一組</button>
                <button onclick="window.print()" class="bg-white text-indigo-700 px-4 py-2 rounded shadow hover:bg-indigo-50 transition font-bold">列印 PDF</button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-6">
        <!-- 學習模式：單字表 -->
        <div id="list-mode" class="block">
            <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-200">
                <div class="bg-indigo-50 p-6 border-b border-indigo-100">
                    <div class="flex justify-between items-end">
                        <div>
                            <h2 class="text-2xl font-bold text-indigo-900">Spelling List (20 Selected Words)</h2>
                            <p class="text-sm text-indigo-600 mt-1">Target Level: A2 Key & B1 Preliminary for Schools</p>
                        </div>
                        <div class="text-right text-xs text-gray-400 no-print">
                            Generated on: <span id="current-date"></span>
                        </div>
                    </div>
                </div>
                
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-700 uppercase text-xs font-bold">
                            <th class="py-3 px-6 border w-1/4">Vocabulary</th>
                            <th class="py-3 px-6 border w-20 text-center">Type</th>
                            <th class="py-3 px-6 border">Definition & Example Sentence</th>
                        </tr>
                    </thead>
                    <tbody id="vocab-table-body" class="text-gray-700 text-sm">
                        <!-- 由 JS 填充 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 測驗模式 -->
        <div id="quiz-mode" class="hidden no-print">
            <div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-gray-800">互動式詞彙測驗</h2>
                    <span id="quiz-progress" class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-sm font-bold">Question 1/20</span>
                </div>
                
                <div id="quiz-container">
                    <!-- 題目內容 -->
                </div>

                <!-- 答題回饋提示 -->
                <div id="quiz-feedback" class="hidden mt-4 p-3 rounded-lg text-center font-bold text-lg feedback-pop">
                </div>

                <div id="quiz-result" class="hidden mt-8 p-10 bg-indigo-50 rounded-2xl text-center">
                    <div class="text-5xl mb-4">🎉</div>
                    <h3 class="text-3xl font-bold text-indigo-900 mb-2">測驗結束！</h3>
                    <p id="score-text" class="text-2xl text-indigo-600 mb-6">你的得分：0 / 20</p>
                    <div class="flex justify-center gap-4">
                        <button onclick="resetQuiz()" class="bg-indigo-600 text-white px-8 py-3 rounded-xl hover:bg-indigo-700 transition font-bold shadow-lg">再測一次</button>
                        <button onclick="refreshWords()" class="bg-white text-indigo-600 border border-indigo-200 px-8 py-3 rounded-xl hover:bg-gray-50 transition font-bold shadow-sm">更換單字池</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 從 KET/PET PDF 整理出的完整單字池
        const fullVocabularyPool = [
            // KET (A2) 程度
            { word: "passport", type: "n", definition: "An official document for traveling to other countries.", example: "You must show your passport at the airport.", chinese: "護照" },
            { word: "pilot", type: "n", definition: "A person who flies an aircraft.", example: "The pilot landed the plane safely in the storm.", chinese: "飛行員" },
            { word: "suitcase", type: "n", definition: "A large case used for carrying clothes when traveling.", example: "My suitcase is too heavy to carry upstairs.", chinese: "行李箱" },
            { word: "ticket", type: "n", definition: "A piece of paper that shows you have paid for a journey.", example: "Can I see your train ticket, please?", chinese: "票" },
            { word: "tourist", type: "n", definition: "A person who visits a place for pleasure.", example: "The city is full of tourists in the summer.", chinese: "觀光客" },
            { word: "mechanic", type: "n", definition: "A person who repairs and maintains machinery and engines.", example: "The mechanic fixed my car's engine yesterday.", chinese: "技工" },
            { word: "engineer", type: "n", definition: "A person who designs or builds machines, engines, or bridges.", example: "She is a civil engineer working on the new bridge.", chinese: "工程師" },
            { word: "factory", type: "n", definition: "A building where goods are manufactured or assembled.", example: "My uncle works in a car factory.", chinese: "工廠" },
            { word: "customer", type: "n", definition: "A person who buys goods or services from a shop.", example: "The shop assistant is helping a customer.", chinese: "顧客" },
            { word: "assistant", type: "n", definition: "A person who helps someone in their job.", example: "He works as a shop assistant in the mall.", chinese: "助手/店員" },
            // PET (B1) 程度
            { word: "journalist", type: "n", definition: "A person who writes for newspapers, magazines, or news websites.", example: "The journalist interviewed the famous singer.", chinese: "記者" },
            { word: "laboratory", type: "n", definition: "A room or building used for scientific research or teaching.", example: "Scientists are working in the laboratory to find a cure.", chinese: "實驗室" },
            { word: "occupation", type: "n", definition: "A job or profession.", example: "Please state your name, age, and occupation.", chinese: "職業" },
            { word: "professional", type: "adj", definition: "Relating to or belonging to a profession.", example: "He gave me some professional advice about my career.", chinese: "專業的" },
            { word: "environment", type: "n", definition: "The surroundings or conditions in which a person lives.", example: "We should do more to protect the environment.", chinese: "環境" },
            { word: "opportunity", type: "n", definition: "A set of circumstances that makes it possible to do something.", example: "Studying abroad is a great opportunity to learn.", chinese: "機會" },
            { word: "experience", type: "n/v", definition: "Practical contact with and observation of facts or events.", example: "Do you have any experience in teaching English?", chinese: "經驗" },
            { word: "comfortable", type: "adj", definition: "Providing physical ease and relaxation.", example: "This sofa is very comfortable to sit on.", chinese: "舒適的" },
            { word: "dangerous", type: "adj", definition: "Likely to cause harm or injury.", example: "It is dangerous to walk alone in the forest at night.", chinese: "危險的" },
            { word: "musician", type: "n", definition: "A person who plays a musical instrument or writes music.", example: "The street musician played the guitar beautifully.", chinese: "音樂家" },
            { word: "knowledge", type: "n", definition: "Facts, information, and skills acquired through education.", example: "He has a wide knowledge of European history.", chinese: "知識" },
            { word: "neighbor", type: "n", definition: "A person living next door or very near to the speaker.", example: "Our neighbor is very friendly and often helps us.", chinese: "鄰居" },
            { word: "apartment", type: "n", definition: "A set of rooms for living in, especially on one floor.", example: "They live in a modern apartment in the city center.", chinese: "公寓" },
            { word: "adventure", type: "n", definition: "An unusual and exciting or daring experience.", example: "Traveling through Africa was a great adventure.", chinese: "冒險" },
            { word: "impossible", type: "adj", definition: "Not able to occur, exist, or be done.", example: "It is impossible to finish all this work in one hour.", chinese: "不可能的" },
            { word: "information", type: "n", definition: "Facts provided or learned about something or someone.", example: "For more information, please visit our website.", chinese: "資訊" },
            { word: "frightened", type: "adj", definition: "Afraid or anxious.", example: "The little boy was frightened of the loud thunder.", chinese: "害怕的" },
            { word: "journey", type: "n", definition: "An act of traveling from one place to another.", example: "The journey from London to Paris takes about three hours.", chinese: "旅程" },
            { word: "particular", type: "adj", definition: "Used to single out an individual member of a group.", example: "Is there any particular reason why you are late?", chinese: "特別的/特定的" },
            { word: "atmosphere", type: "n", definition: "The envelope of gases surrounding the earth or another planet.", example: "The restaurant has a very romantic atmosphere.", chinese: "氣氛/大氣層" }
        ];

        let currentWords = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let shuffledQuizWords = [];

        // 隨機選取 20 個單字
        function refreshWords() {
            currentWords = [...fullVocabularyPool]
                .sort(() => Math.random() - 0.5)
                .slice(0, 20);
            
            document.getElementById('current-date').innerText = new Date().toLocaleDateString();
            initTable();
            switchMode('list');
            if (window.innerWidth < 768) window.scrollTo(0, 0);
        }

        // 初始化單字表
        function initTable() {
            const tbody = document.getElementById('vocab-table-body');
            tbody.innerHTML = '';
            currentWords.forEach(item => {
                const row = `
                    <tr class="border-b hover:bg-indigo-50 transition">
                        <td class="py-4 px-6">
                            <div class="font-bold text-indigo-700 text-lg">${item.word}</div>
                            <div class="text-xs text-gray-400 font-normal mt-1">${item.chinese}</div>
                        </td>
                        <td class="py-4 px-6 text-center italic text-orange-600 font-medium">${item.type}</td>
                        <td class="py-4 px-6">
                            <p class="font-semibold text-gray-800 leading-tight">${item.definition}</p>
                            <p class="italic text-gray-500 mt-2 border-l-2 border-gray-200 pl-3">"${item.example}"</p>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        function switchMode(mode) {
            if (mode === 'list') {
                document.getElementById('list-mode').classList.remove('hidden');
                document.getElementById('quiz-mode').classList.add('hidden');
            } else {
                document.getElementById('list-mode').classList.add('hidden');
                document.getElementById('quiz-mode').classList.remove('hidden');
                resetQuiz();
            }
        }

        function resetQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            shuffledQuizWords = [...currentWords].sort(() => Math.random() - 0.5);
            document.getElementById('quiz-result').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            document.getElementById('quiz-feedback').classList.add('hidden');
            showQuestion();
        }

        function showQuestion() {
            const container = document.getElementById('quiz-container');
            const feedback = document.getElementById('quiz-feedback');
            const currentItem = shuffledQuizWords[currentQuestionIndex];
            
            feedback.classList.add('hidden');
            document.getElementById('quiz-progress').innerText = `Question ${currentQuestionIndex + 1}/20`;

            // 產生隨機干擾項 (從 pool 裡隨機抓，不限於目前的 20 個，這樣更難一點)
            let options = [currentItem.word];
            while(options.length < 4) {
                let randomWord = fullVocabularyPool[Math.floor(Math.random() * fullVocabularyPool.length)].word;
                if(!options.includes(randomWord)) options.push(randomWord);
            }
            options.sort(() => Math.random() - 0.5);

            container.innerHTML = `
                <div class="mb-8">
                    <p class="text-xs text-indigo-500 font-bold uppercase tracking-widest mb-2">Word Definition</p>
                    <h3 class="text-xl font-bold text-gray-800 mb-4 leading-snug">${currentItem.definition}</h3>
                    <div class="bg-gray-50 p-4 rounded-xl border-l-4 border-indigo-400 italic text-gray-600">
                        " ${currentItem.example.replace(new RegExp(currentItem.word, 'gi'), '__________')} "
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    ${options.map(opt => `
                        <button onclick="checkAnswer('${opt}')" 
                                class="quiz-option w-full text-left p-4 border-2 border-gray-200 rounded-xl hover:border-indigo-400 hover:bg-indigo-50 transition-all font-semibold text-gray-700">
                            ${opt}
                        </button>
                    `).join('')}
                </div>
            `;
        }

        function checkAnswer(selected) {
            const correct = shuffledQuizWords[currentQuestionIndex].word;
            const buttons = document.querySelectorAll('.quiz-option');
            const feedback = document.getElementById('quiz-feedback');
            
            feedback.classList.remove('hidden');
            
            buttons.forEach(btn => {
                btn.disabled = true;
                const btnText = btn.innerText.trim();
                if(btnText === correct) {
                    btn.classList.add('correct');
                } else if(btnText === selected && selected !== correct) {
                    btn.classList.add('wrong');
                }
            });

            if (selected === correct) {
                score++;
                feedback.innerText = "Correct! ✨";
                feedback.className = "mt-4 p-3 rounded-lg text-center font-bold text-lg feedback-pop bg-green-100 text-green-700";
            } else {
                feedback.innerText = `Incorrect. The answer is "${correct}".`;
                feedback.className = "mt-4 p-3 rounded-lg text-center font-bold text-lg feedback-pop bg-red-100 text-red-700";
            }

            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < 20) {
                    showQuestion();
                } else {
                    finishQuiz();
                }
            }, 1800);
        }

        function finishQuiz() {
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('quiz-feedback').classList.add('hidden');
            document.getElementById('quiz-result').classList.remove('hidden');
            document.getElementById('score-text').innerText = `你的得分：${score} / 20`;
        }

        // 初始化
        window.onload = refreshWords;
    </script>
</body>
</html>
